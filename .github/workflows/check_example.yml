name: check_example

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  example-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest patch release of each supported Go minor version.
        go: ['1.26.x', '1.27.x']
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: setup go build environment
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: linter
        run: cd examples/service && make mod deps linter govulncheck GOPATH=$(go env GOPATH)
      - name: go.mod and go.sum are tidy
        run: cd examples/service && make modcheck GOPATH=$(go env GOPATH)

  example-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: setup go build environment
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: unit tests
        run: cd examples/service && make mod deps gendoc generate confcheck test GOPATH=$(go env GOPATH)

  example-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: setup go build environment
        uses: actions/setup-go@v7
        with:
          # Matches the base image in resources/docker/Dockerfile.dev, which
          # compiles the container build.
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: set RELEASE number
        run: cd examples/service && echo ${GITHUB_RUN_NUMBER} > RELEASE
      - name: integration tests
        run: cd examples/service && make mod deps generate build docker dockertest GOPATH=$(go env GOPATH)
