name: check_example

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  example-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest patch release of each supported Go minor version.
        go: ['1.26.x', '1.27.x']
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          # The protobuf breaking change check compares with the main branch.
          fetch-depth: 0
      - name: setup go build environment
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: linter
        run: cd examples/service && make mod deps protolint linter govulncheck GOPATH=$(go env GOPATH)
      - name: protobuf breaking changes
        run: |
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main
          cd examples/service && make protobreaking GOPATH=$(go env GOPATH)
      - name: generated protobuf code is up to date
        run: |
          cd examples/service && make protogen GOPATH=$(go env GOPATH)
          test -z "$(git status --porcelain -- internal/gen)" \
            || (git status --porcelain -- internal/gen && echo "Generated protobuf code is stale: run 'make protogen' and commit the result." && exit 1)
      - name: go.mod and go.sum are tidy
        run: cd examples/service && make modcheck GOPATH=$(go env GOPATH)

  example-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: setup go build environment
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: unit tests
        run: cd examples/service && make mod deps gendoc generate confcheck test GOPATH=$(go env GOPATH)

  example-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: setup go build environment
        uses: actions/setup-go@v7
        with:
          # Matches the base image in resources/docker/Dockerfile.dev, which
          # compiles the container build.
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: set RELEASE number
        run: cd examples/service && echo ${GITHUB_RUN_NUMBER} > RELEASE
      - name: integration tests
        run: cd examples/service && make mod deps generate build docker dockertest GOPATH=$(go env GOPATH)
